<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة الإدارة | MK</title><link rel="stylesheet" href="/assets/css/styles.css"><style>.box{width:min(1000px,calc(100% - 30px));margin:45px auto;background:var(--panel);padding:28px;border:1px solid var(--line)}form{display:grid;gap:12px;max-width:500px}input,textarea{padding:12px;background:var(--bg);border:1px solid var(--line);color:var(--text);font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.list>div{padding:10px;border-bottom:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="box"><a class="brand" href="/"><b>MK</b><span>MOHAMED <i>KHAMIS</i><small>ADMIN CONSOLE</small></span></a><section id="login"><h1>تسجيل دخول الإدارة</h1><form id="loginForm"><input name="email" type="email" placeholder="البريد الإلكتروني" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="cta">دخول</button><p id="loginStatus"></p></form></section><section id="dash" hidden><h1>لوحة التحكم</h1><p id="identity"></p><button id="logout">تسجيل الخروج</button><div class="grid"><div><h2>المشاريع</h2><form id="addProject"><input name="title" placeholder="اسم المشروع" required><textarea name="description" placeholder="الوصف" required></textarea><input name="technologies" placeholder="التقنيات"><label><input type="checkbox" name="published"> نشر</label><button class="cta">إضافة</button></form><div id="projects" class="list"></div></div><div><h2>الخدمات</h2><form id="addService"><input name="title" placeholder="اسم الخدمة" required><textarea name="description" placeholder="الوصف" required></textarea><label><input type="checkbox" name="published" checked> نشر</label><button class="cta">إضافة</button></form><div id="services" class="list"></div></div></div><h2>طلبات
