<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B18" />
      <stop offset="100%" stop-color="#0F1B38" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Subtle Grid Pattern in background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0, 242, 254, 0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(212, 175, 55, 0.08)" stroke-width="2" />

  <!-- Monogram MK Geometry -->
  <g transform="translate(68, 68) scale(0.74)">
    <!-- M Left Stem -->
    <path d="M 90 400 L 90 110 L 140 110 L 140 400 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
    <!-- M Center Chevron -->
    <path d="M 140 110 L 210 230 L 280 110 L 320 110 L 210 300 Z" fill="url(#cyanGrad)" />
    <!-- M Right Stem / K Spine -->
    <path d="M 280 110 L 330 110 L 330 400 L 280 400 Z" fill="url(#cyanGrad)" />
    <!-- K Upper Arm (Gold Luxury) -->
    <path d="M 250 240 L 350 110 L 410 110 L 290 270 Z" fill="url(#goldLuxury)" filter="url(#glow)" />
    <!-- K Lower Leg (Gold Luxury) -->
    <path d="M 270 250 L 400 400 L 340 400 L 240 280 Z" fill="url(#goldLuxury)" />

    <!-- Crown / Accent Star -->
    <polygon points="256,40 268,75 305,75 275,97 286,132 256,110 226,132 237,97 207,75 244,75" fill="url(#goldLuxury)" />
  </g>
</svg>
