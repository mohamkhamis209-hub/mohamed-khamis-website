<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- MK Monogram Icon -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal / Shield High-tech Frame -->
    <rect x="5" y="5" width="110" height="110" rx="28" fill="#0B132B" stroke="url(#cyanGrad)" stroke-width="2.5" />
    <rect x="9" y="9" width="102" height="102" rx="24" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1" />
    
    <!-- Stylized M & K Monogram Geometry -->
    <!-- M Pillar Left -->
    <path d="M 30 92 L 30 28 L 44 28 L 44 92 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
    <!-- M Center Chevron -->
    <path d="M 44 28 L 60 54 L 76 28 L 86 28 L 60 70 Z" fill="url(#cyanGrad)" />
    <!-- M Pillar Right / K Stem -->
    <path d="M 76 28 L 90 28 L 90 92 L 76 92 Z" fill="url(#cyanGrad)" />
    <!-- K Upper Diagonal (Gold Accent) -->
    <path d="M 68 56 L 94 28 L 105 28 L 76 64 Z" fill="url(#goldLuxury)" />
    <!-- K Lower Diagonal (Gold Accent) -->
    <path d="M 72 60 L 104 92 L 91 92 L 64 68 Z" fill="url(#goldLuxury)" />
    
    <!-- Micro Tech Dot Accent -->
    <circle cx="95" cy="22" r="3" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="25" cy="98" r="2.5" fill="#D4AF37" />
  </g>

  <!-- Brand Typography -->
  <!-- Primary Brand Name -->
  <text x="145" y="65" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF">
    MOHAMED <tspan fill="url(#cyanGrad)">KHAMIS</tspan>
  </text>
  
  <!-- Subtitle / Title -->
  <text x="147" y="92" font-family="'Cairo', 'IBM Plex Sans Arabic', 'Inter', sans-serif" font-weight="600" font-size="13" letter-spacing="3" fill="#94A3B8">
    TECHNOLOGY &amp; INNOVATION SPECIALIST
  </text>
  
  <!-- Subtle Luxury Underline Rule -->
  <line x1="147" y1="104" x2="380" y2="104" stroke="url(#goldLuxury)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="390" cy="104" r="2" fill="#00F2FE" />
</svg>
