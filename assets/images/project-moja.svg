<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMoja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F24" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanMoja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="rustGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#D35400" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgMoja)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.15" stroke="#00F2FE" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- IDE Window Frame -->
  <rect x="100" y="55" width="600" height="340" rx="14" fill="#0D162C" stroke="rgba(0, 242, 254, 0.3)" stroke-width="2" />
  
  <!-- Window Header -->
  <path d="M 100 55 L 700 55 A 14 14 0 0 1 700 95 L 100 95 Z" fill="#0A1122" />
  <circle cx="125" cy="75" r="5" fill="#EF4444" />
  <circle cx="140" cy="75" r="5" fill="#F59E0B" />
  <circle cx="155" cy="75" r="5" fill="#10B981" />
  <text x="400" y="79" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">MJ Studio — main.mj (Rust Engine)</text>
  
  <!-- Code Editor Content -->
  <g transform="translate(130, 130)" font-family="'Fira Code', 'Courier New', monospace" font-size="15">
    <text x="0" y="0" fill="#94A3B8">// لغة برمجة عربية ومحرك تفسير مكتوب بلغة Rust</text>
    <text x="0" y="30" fill="url(#rustGold)">متغير <tspan fill="#FFFFFF">الرسالة</tspan> = <tspan fill="#34D399">"أهلاً بالعالم من MOJA"</tspan>;</text>
    <text x="0" y="60" fill="url(#cyanMoja)">دالة <tspan fill="#FFFFFF">ابدأ_التنفيذ</tspan>() {</text>
    <text x="30" y="90" fill="#F3E5AB">اطبع(<tspan fill="#FFFFFF">الرسالة</tspan>);</text>
    <text x="30" y="120" fill="url(#cyanMoja)">إذا <tspan fill="#FFFFFF">(الحالة == نشط)</tspan> {</text>
    <text x="60" y="150" fill="#38BDF8">شغل_محرك_التفسير_Rust();</text>
    <text x="30" y="180" fill="url(#cyanMoja)">}</text>
    <text x="0" y="210" fill="url(#cyanMoja)">}</text>
  </g>

  <!-- Rust + Arab Badge -->
  <g transform="translate(560, 310)">
    <rect width="115" height="32" rx="8" fill="#1E293B" stroke="url(#rustGold)" stroke-width="1.5" />
    <text x="57" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F39C12" text-anchor="middle">Rust Core AST</text>
  </g>
</svg>
