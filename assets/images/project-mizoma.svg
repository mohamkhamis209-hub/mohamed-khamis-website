<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMizoma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1F" />
      <stop offset="100%" stop-color="#020512" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="50%" stop-color="#8E24AA" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="pythonFastAPI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688" />
      <stop offset="100%" stop-color="#4DB6AC" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgMizoma)" />

  <!-- AI Brain / Spark Star Effect -->
  <g transform="translate(180, 225)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(142, 36, 170, 0.25)" stroke-width="2" stroke-dasharray="6 6" />
    <!-- 4-pointed Gemini-style Star -->
    <path d="M 0 -65 Q 0 0 65 0 Q 0 0 0 65 Q 0 0 -65 0 Q 0 0 0 -65 Z" fill="url(#geminiGrad)" opacity="0.9" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
  </g>

  <!-- Conversational Flow Panel -->
  <g transform="translate(360, 60)">
    <rect width="380" height="330" rx="14" fill="#0A1329" stroke="rgba(0, 242, 254, 0.35)" stroke-width="2" />
    
    <!-- Header -->
    <rect width="380" height="50" rx="14" fill="#0E1935" />
    <circle cx="25" cy="25" r="6" fill="#00E5FF" />
    <text x="45" y="30" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Mizoma AI Assistant</text>
    <text x="350" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#4DB6AC" text-anchor="end">FastAPI v0.110</text>

    <!-- Chat Message: User -->
    <g transform="translate(20, 70)">
      <rect width="260" height="48" rx="10" fill="#1A284A" />
      <text x="15" y="28" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">حلل لي كود الـ API واستخرج الثغرات</text>
    </g>

    <!-- Chat Message: Mizoma AI with Gemini -->
    <g transform="translate(60, 130)">
      <rect width="300" height="110" rx="10" fill="#0D1E3A" stroke="url(#geminiGrad)" stroke-width="1.5" />
      <text x="15" y="25" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#00E5FF">Mizoma AI (Gemini Pro):</text>
      <text x="15" y="50" font-family="'Cairo', sans-serif" font-size="12" fill="#CBD5E1">تم فحص مسار الطلب بنجاح. يوصى بإضافة</text>
      <text x="15" y="70" font-family="'Cairo', sans-serif" font-size="12" fill="#CBD5E1">Rate Limiting وربط الـ Headers الأمنية.</text>
      <text x="15" y="94" font-family="'Inter', monospace" font-size="11" fill="#FBBF24">Tokens: 142 • Latency: 180ms</text>
    </g>

    <!-- Backend Status Bar -->
    <g transform="translate(20, 260)">
      <rect width="340" height="50" rx="8" fill="#070E21" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="25" r="5" fill="#10B981" />
      <text x="35" y="29" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Python / FastAPI Backend Relay: <tspan fill="#34D399">Active</tspan></text>
    </g>
  </g>
</svg>
