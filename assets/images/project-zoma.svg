<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgZoma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D20" />
      <stop offset="100%" stop-color="#02040E" />
    </linearGradient>
    <linearGradient id="cyanZoma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="purpleZoma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgZoma)" />

  <!-- Mobile / Tablet Device Mockup Outline -->
  <g transform="translate(140, 45)">
    <rect width="250" height="360" rx="24" fill="#0A1326" stroke="url(#cyanZoma)" stroke-width="2.5" />
    <circle cx="125" cy="20" r="4" fill="#1E293B" />

    <!-- App Screen inside -->
    <rect x="15" y="40" width="220" height="300" rx="14" fill="#0E1A33" />
    <text x="30" y="70" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#00F2FE">مرحباً بك في ZOMA</text>
    <text x="30" y="88" font-family="'Cairo', sans-serif" font-size="11" fill="#94A3B8">جدولك الدراسي اليومي</text>

    <!-- Task 1 -->
    <rect x="30" y="105" width="190" height="50" rx="8" fill="#142347" />
    <circle cx="48" cy="130" r="7" fill="#10B981" />
    <text x="65" y="126" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">مراجعة الرياضيات</text>
    <text x="65" y="142" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">04:00 PM • مكتمل</text>

    <!-- Task 2 -->
    <rect x="30" y="165" width="190" height="50" rx="8" fill="#142347" />
    <circle cx="48" cy="190" r="7" fill="url(#purpleZoma)" />
    <text x="65" y="186" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">محاضرة البرمجة</text>
    <text x="65" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">06:30 PM • قادمة</text>

    <!-- Progress Meter -->
    <rect x="30" y="235" width="190" height="85" rx="8" fill="#182A52" />
    <text x="42" y="258" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#F3E5AB">مؤشر الإنجاز اليومي</text>
    <rect x="42" y="270" width="166" height="10" rx="5" fill="#0B1326" />
    <rect x="42" y="270" width="125" height="10" rx="5" fill="url(#cyanZoma)" />
    <text x="42" y="302" font-family="'Inter', sans-serif" font-size="10" fill="#38BDF8">75% Completed</text>
  </g>

  <!-- Side Feature Highlights -->
  <g transform="translate(430, 90)">
    <text x="0" y="30" font-family="'Cairo', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">ZOMA Student</text>
    <text x="0" y="55" font-family="'Cairo', sans-serif" font-size="14" fill="#00F2FE">رفيق الطالب الرقمي للدراسة والمتابعة</text>
    
    <g transform="translate(0, 80)">
      <circle cx="12" cy="12" r="8" fill="#0E2245" stroke="url(#cyanZoma)" stroke-width="1.5" />
      <text x="32" y="17" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">تنظيم المواعيد والجداول الدراسية</text>

      <circle cx="12" cy="52" r="8" fill="#0E2245" stroke="url(#cyanZoma)" stroke-width="1.5" />
      <text x="32" y="57" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">تتبع المهام والواجبات اليومية</text>

      <circle cx="12" cy="92" r="8" fill="#0E2245" stroke="url(#cyanZoma)" stroke-width="1.5" />
      <text x="32" y="97" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">تنبيهات مخصصة قبل مواعيد الاختبارات</text>

      <circle cx="12" cy="132" r="8" fill="#0E2245" stroke="url(#cyanZoma)" stroke-width="1.5" />
      <text x="32" y="137" font-family="'Cairo', sans-serif" font-size="13" fill="#E2E8F0">تصميم خالٍ من المشتتات البصرية</text>
    </g>
  </g>
</svg>
